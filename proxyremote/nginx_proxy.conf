proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=STREAM_CACHE:10m max_size=500m inactive=5m use_temp_path=off;

server {
    listen 80;
    resolver 192.168.40.1;
    server_name localhost;

    # Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Segments location
    location ~ ^/([^/]+)/stream/(.*)$ {
        access_log off;
        set $akamai_host $1;
        set $segment_path $2;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, Accept-Ranges' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_set_header Host $akamai_host;
        proxy_set_header Origin "https://www.vidio.com";
        proxy_set_header Referer "https://www.vidio.com";
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36 OpsMonitoring";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Range $http_range;
        proxy_set_header Connection "keep-alive";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass https://$akamai_host/stream/$segment_path$is_args$args;
        proxy_http_version 1.1;
        
        # Fast RAM caching for .mp4 init maps and .m4s segment chunks
        proxy_cache STREAM_CACHE;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_force_ranges on;
    }

    # Unified location for primary/backup M3U8 filtering
    location ~ ^/(primary|backup)/([^/]+)(/stream/.+\.(m3u8|mpd))(.*)$ {
        access_log off;
        set $stream_type $1;
        set $akamai_host $2;
        set $playlist_path $3;
        set $query_params $5;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, Accept-Ranges' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_set_header Host $akamai_host;
        proxy_set_header Origin "https://www.vidio.com";
        proxy_set_header Referer "https://www.vidio.com";
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36 OpsMonitoring";
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass https://$akamai_host$playlist_path$is_args$args;

        body_filter_by_lua_block {
            if ngx.ctx.buffered == nil then
                ngx.ctx.buffered = ""
            end
            ngx.ctx.buffered = ngx.ctx.buffered .. ngx.arg[1]
            ngx.arg[1] = ""

            if ngx.arg[2] then
                local body = ngx.ctx.buffered
                local stream_type = ngx.var.stream_type
                local akamai_host = ngx.var.akamai_host
                local playlist_path = ngx.var.playlist_path
                local new_body = {}

                local lines = {}
                for line in string.gmatch(body, "([^\r\n]*)") do
                    if line ~= "" then
                        table.insert(lines, line)
                    end
                end

                local function is_stream_match(str, stype)
                    if not str then return false end
                    -- Exclude AV1 codec tracks to prevent NAL unit decoding errors in VLC & MediaMTX
                    if string.find(str, "av1%-", 1) ~= nil or string.find(str, "av01", 1, true) ~= nil then
                        return false
                    end
                    if stype == "primary" then
                        return string.find(str, "hls%-p", 1) ~= nil or string.find(str, "/file/primary/", 1, true) ~= nil or string.find(str, 'PATHWAY%-ID="primary"', 1) ~= nil or string.find(str, "primary", 1, true) ~= nil
                    else
                        return string.find(str, "hls%-b", 1) ~= nil or string.find(str, "/file/backup/", 1, true) ~= nil or string.find(str, 'PATHWAY%-ID="backup"', 1) ~= nil or string.find(str, "backup", 1, true) ~= nil
                    end
                end

                -- Check if this is a DRM HLS pattern (contains /drm/hls/)
                if string.find(playlist_path, "/drm/hls/", 1, true) then
                    for i, line in ipairs(lines) do
                        if string.find(line, "#EXTM3U", 1, true) then
                            table.insert(new_body, line)
                        elseif string.find(line, "#EXT-X-STREAM-INF", 1, true) then
                            for j = i + 1, #lines do
                                if lines[j] ~= "" then
                                    if is_stream_match(lines[j], stream_type) or is_stream_match(line, stream_type) then
                                        table.insert(new_body, line)
                                        table.insert(new_body, lines[j])
                                    end
                                    break
                                end
                            end
                        end
                    end
                else
                    -- Original filtering logic for non-DRM HLS
                    for i, line in ipairs(lines) do
                        if string.find(line, "#EXTM3U", 1, true) or string.find(line, "##", 1, true) or string.find(line, "#EXT-X-INDEPENDENT-SEGMENTS", 1, true) then
                            table.insert(new_body, line)
                        end
                    end

                    if string.find(body, "#EXT%-X%-MEDIA", 1) then
                        local audio_group_id = stream_type .. "-audio"

                        for i, line in ipairs(lines) do
                            if string.find(line, "#EXT-X-MEDIA", 1, true) and (string.find(line, 'GROUP-ID="' .. audio_group_id .. '"', 1, true) or is_stream_match(line, stream_type)) then
                                table.insert(new_body, line)
                            end
                        end

                        for i, line in ipairs(lines) do
                            if string.find(line, "#EXT-X-STREAM-INF", 1, true) and (string.find(line, "RESOLUTION=640x360", 1, true) or string.find(line, "360p", 1, true)) then
                                for j = i + 1, #lines do
                                    if lines[j] ~= "" then
                                        if is_stream_match(lines[j], stream_type) then
                                            table.insert(new_body, line)
                                            table.insert(new_body, lines[j])
                                        end
                                        break
                                    end
                                end
                            end
                        end
                    else
                        for i, line in ipairs(lines) do
                            if string.find(line, "#EXT-X-STREAM-INF", 1, true) then
                                for j = i + 1, #lines do
                                    if lines[j] ~= "" then
                                        if is_stream_match(lines[j], stream_type) or is_stream_match(line, stream_type) then
                                            table.insert(new_body, line)
                                            table.insert(new_body, lines[j])
                                        end
                                        break
                                    end
                                end
                            end
                        end
                    end
                end

                ngx.arg[1] = table.concat(new_body, "\n") .. "\n"
            end
        }

        sub_filter_types text/plain application/vnd.apple.mpegurl application/x-mpegurl;
        sub_filter_once off;
        sub_filter '/stream/' '/$akamai_host/stream/';
        sub_filter '"/stream/' '"/$akamai_host/stream/';
        sub_filter "'/stream/" "'/$akamai_host/stream/";
    }

    # Unfiltered location
    location ~ ^/([^/]+)(/stream/.+\.(m3u8|mpd))(.*)$ {
        access_log off;
        set $akamai_host $1;
        set $playlist_path $2;
        set $query_params $4;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, Accept-Ranges' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_set_header Host $akamai_host;
        proxy_set_header Origin "https://www.vidio.com";
        proxy_set_header Referer "https://www.vidio.com";
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36 OpsMonitoring";
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass https://$akamai_host$playlist_path$is_args$args;

        sub_filter_types text/plain application/vnd.apple.mpegurl application/x-mpegurl;
        sub_filter_once off;
        sub_filter '/stream/' '/$akamai_host/stream/';
        sub_filter '"/stream/' '"/$akamai_host/stream/';
        sub_filter "'/stream/" "'/$akamai_host/stream/";
    }
}
